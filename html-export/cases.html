<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UbiqLoupe - Cases</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidenav" id="sidenav"></aside>
    <main class="content">
      <div class="page-head">
        <span class="eyebrow">Case tracker</span>
        <h1>Cases</h1>
        <p>Track the status of your reported issues.</p>
      </div>

      <div class="pill-group" id="filterGroup">
        <label class="pill"><input type="radio" name="statusFilter" value="all" checked><span>All Cases</span></label>
        <label class="pill"><input type="radio" name="statusFilter" value="open"><span>Open</span></label>
        <label class="pill"><input type="radio" name="statusFilter" value="in_progress"><span>In Progress</span></label>
        <label class="pill"><input type="radio" name="statusFilter" value="resolved"><span>Resolved</span></label>
      </div>

      <div class="card" style="animation-delay: 0.1s; display: flex; flex-direction: column;">
        <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem;">
          <h3 style="margin: 0; font-size: 1.25rem;">Water Main Break</h3>
          <span style="background: rgba(234, 179, 8, 0.2); color: #fde047; padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.85rem; font-weight: 600;">In Progress</span>
        </div>
        <p style="color: var(--text-secondary); margin-bottom: 1.5rem;">Reported 3 days ago • Downtown Area</p>
        <div style="background: rgba(0,0,0,0.2); height: 8px; border-radius: 4px; overflow: hidden; margin-bottom: 0.5rem;">
          <div style="width: 60%; background: var(--accent-gradient); height: 100%; border-radius: 4px;"></div>
        </div>
        <p style="font-size: 0.85rem; color: var(--text-secondary); text-align: right; margin: 0;">City crew dispatched</p>
      </div>

      <div class="card" style="animation-delay: 0.2s; display: flex; flex-direction: column;">
        <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem;">
          <h3 style="margin: 0; font-size: 1.25rem;">Noise Complaint</h3>
          <span style="background: rgba(34, 197, 94, 0.2); color: #86efac; padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.85rem; font-weight: 600;">Resolved</span>
        </div>
        <p style="color: var(--text-secondary); margin-bottom: 1.5rem;">Reported 1 week ago • Northside</p>
        <div style="background: rgba(0,0,0,0.2); height: 8px; border-radius: 4px; overflow: hidden; margin-bottom: 0.5rem;">
          <div style="width: 100%; background: #22c55e; height: 100%; border-radius: 4px;"></div>
        </div>
        <p style="font-size: 0.85rem; color: var(--text-secondary); text-align: right; margin: 0;">Case closed by authority</p>
      </div>
    </main>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
