<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UbiqLoupe - Index</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidenav" id="sidenav"></aside>
    <main class="content">
      <div class="page-head">
        <span class="eyebrow">Dashboard</span>
        <h1>Index</h1>
        <p>Your social platform overview.</p>
      </div>
      
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem; margin-bottom: 2.5rem;">
        <div class="card" style="animation-delay: 0.1s; margin-bottom: 0; text-align: center;">
          <h2 style="font-size: 2.5rem; margin: 0; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">12</h2>
          <p style="margin: 0; color: var(--text-secondary); text-transform: uppercase; font-size: 0.8rem; font-weight: 600; letter-spacing: 1px;">Active Cases</p>
        </div>
        <div class="card" style="animation-delay: 0.2s; margin-bottom: 0; text-align: center;">
          <h2 style="font-size: 2.5rem; margin: 0; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">342</h2>
          <p style="margin: 0; color: var(--text-secondary); text-transform: uppercase; font-size: 0.8rem; font-weight: 600; letter-spacing: 1px;">Community Posts</p>
        </div>
        <div class="card" style="animation-delay: 0.3s; margin-bottom: 0; text-align: center;">
          <h2 style="font-size: 2.5rem; margin: 0; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">56</h2>
          <p style="margin: 0; color: var(--text-secondary); text-transform: uppercase; font-size: 0.8rem; font-weight: 600; letter-spacing: 1px;">Saved Items</p>
        </div>
      </div>

      <div class="card" style="animation-delay: 0.4s;">
        <h3 style="margin-top: 0; margin-bottom: 1.5rem;">Recent Activity</h3>
        <div style="display: flex; flex-direction: column; gap: 1rem;">
          <div style="display: flex; align-items: center; gap: 1rem;">
            <div style="width: 8px; height: 8px; border-radius: 50%; background: var(--accent-color);"></div>
            <p style="margin: 0;">Jane Doe liked your report on <strong>Pothole on Main St.</strong></p>
            <span style="margin-left: auto; color: var(--text-secondary); font-size: 0.85rem;">2m ago</span>
          </div>
          <div style="display: flex; align-items: center; gap: 1rem;">
            <div style="width: 8px; height: 8px; border-radius: 50%; background: #3b82f6;"></div>
            <p style="margin: 0;">Your case <strong>Water Main Break</strong> is now In Progress.</p>
            <span style="margin-left: auto; color: var(--text-secondary); font-size: 0.85rem;">1h ago</span>
          </div>
          <div style="display: flex; align-items: center; gap: 1rem;">
            <div style="width: 8px; height: 8px; border-radius: 50%; background: var(--text-secondary);"></div>
            <p style="margin: 0;">You saved Mike Smith's post.</p>
            <span style="margin-left: auto; color: var(--text-secondary); font-size: 0.85rem;">5h ago</span>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
