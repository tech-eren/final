<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UbiqLoupe - Login</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-image: 
        radial-gradient(circle at 30% 20%, rgba(99, 102, 241, 0.15), transparent 50%),
        radial-gradient(circle at 70% 80%, rgba(168, 85, 247, 0.15), transparent 50%);
    }
    .login-container {
      width: 100%;
      max-width: 420px;
      padding: 3rem 2.5rem;
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      box-shadow: var(--shadow-glow);
      text-align: center;
      animation: fadeIn 0.6s ease-out forwards;
    }
    .login-container .logo {
      margin-bottom: 2.5rem;
      padding-left: 0;
      font-size: 2.5rem;
      justify-content: center;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo">UbiqLoupe</div>
    <form action="index.html">
      <div class="input-group" style="text-align: left;">
        <label>Email Address</label>
        <input type="email" class="form-control" placeholder="you@example.com" required>
      </div>
      <div class="input-group" style="text-align: left;">
        <label>Password</label>
        <input type="password" class="form-control" placeholder="••••••••" required>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; font-size: 0.9rem;">
        <label style="display: flex; align-items: center; gap: 0.5rem; color: var(--text-secondary); cursor: pointer;">
          <input type="checkbox" style="accent-color: var(--accent-color);"> Remember me
        </label>
        <a href="#" style="color: var(--accent-color); text-decoration: none;">Forgot password?</a>
      </div>
      <button type="submit" class="btn-primary">Sign In</button>
      
      <div style="margin-top: 2rem; position: relative;">
        <div style="position: absolute; top: 50%; left: 0; right: 0; height: 1px; background: var(--border-color); z-index: 1;"></div>
        <span style="position: relative; z-index: 2; background: var(--bg-dark); padding: 0 1rem; color: var(--text-secondary); font-size: 0.85rem;">OR</span>
      </div>
      
      <p style="margin-top: 2rem; color: var(--text-secondary); font-size: 0.95rem;">
        Don't have an account? <a href="#" style="color: var(--accent-color); text-decoration: none; font-weight: 600;">Sign up</a>
      </p>
    </form>
  </div>
</body>
</html>
