<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UbiqLoupe - Settings</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidenav" id="sidenav"></aside>
    <main class="content">
      <div class="page-head">
        <span class="eyebrow">Preferences</span>
        <h1>Settings</h1>
        <p>Manage your account and preferences.</p>
      </div>

      <div class="card" style="animation-delay: 0.1s;">
        <h3 style="margin-top: 0;">Profile Settings</h3>
        <div class="input-group">
          <label>Display Name</label>
          <input type="text" class="form-control" value="User Name">
        </div>
        <div class="input-group">
          <label>Email Address</label>
          <input type="email" class="form-control" value="user@example.com">
        </div>
        <button class="btn-primary" style="width: auto; padding: 0.75rem 1.5rem;">Save Changes</button>
      </div>

      <div class="card" style="animation-delay: 0.2s;">
        <h3 style="margin-top: 0; color: #ef4444;">Danger Zone</h3>
        <p style="color: var(--text-secondary);">Permanently delete your account and all associated data.</p>
        <button class="btn-primary" style="width: auto; padding: 0.75rem 1.5rem; background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.2);">Delete Account</button>
      </div>
    </main>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
