<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UbiqLoupe - Profile</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidenav" id="sidenav"></aside>
    <main class="content">
      <div class="page-head">
        <span class="eyebrow">Your Account</span>
        <h1>Profile</h1>
        <p>Manage your public persona.</p>
      </div>
      
      <div class="card" style="text-align: center; padding: 3rem 2rem; animation-delay: 0.1s;">
        <div class="avatar" style="width: 100px; height: 100px; font-size: 2.5rem; margin: 0 auto 1.5rem auto; box-shadow: 0 8px 24px rgba(139, 92, 246, 0.4);">U</div>
        <h2 style="margin: 0 0 0.5rem 0; font-size: 2rem;">User Name</h2>
        <p style="color: var(--text-secondary); margin-bottom: 2.5rem; font-size: 1.1rem;">@username • Member since 2026</p>
        
        <div style="display: flex; justify-content: center; gap: 4rem; margin-bottom: 3rem; background: rgba(0,0,0,0.2); padding: 1.5rem; border-radius: 16px; border: 1px solid var(--border-color);">
          <div>
            <h3 style="margin: 0; font-size: 1.75rem; color: var(--text-primary);">42</h3>
            <span style="color: var(--text-secondary); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; font-weight: 600;">Posts</span>
          </div>
          <div>
            <h3 style="margin: 0; font-size: 1.75rem; color: var(--text-primary);">12</h3>
            <span style="color: var(--text-secondary); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; font-weight: 600;">Cases</span>
          </div>
          <div>
            <h3 style="margin: 0; font-size: 1.75rem; color: var(--text-primary);">1.2k</h3>
            <span style="color: var(--text-secondary); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; font-weight: 600;">Likes</span>
          </div>
        </div>
        
        <button class="btn-primary" style="width: auto; padding: 0.75rem 2.5rem;">Edit Profile</button>
      </div>
    </main>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
