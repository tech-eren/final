<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UbiqLoupe - Saved Posts</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidenav" id="sidenav"></aside>
    <main class="content">
      <div class="page-head">
        <span class="eyebrow">Bookmarks</span>
        <h1>Saved Posts</h1>
        <p>Everything you wanted to keep track of.</p>
      </div>

      <div class="card" style="animation-delay: 0.1s;">
        <div class="card-header">
          <div class="avatar" style="background: linear-gradient(135deg, #10b981, #3b82f6);">M</div>
          <div class="user-info">
            <h4>Mike Smith</h4>
            <p>@mikesmith • 5h ago</p>
          </div>
        </div>
        <div class="card-body">
          <p>The new park renovations are looking amazing! Attached a few photos of the new playground equipment. Great job city council! 🌳🏞️</p>
        </div>
        <div class="card-actions">
          <button class="action-btn" style="color: var(--accent-color);">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg> Saved
          </button>
        </div>
      </div>
    </main>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
