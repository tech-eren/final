<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UbiqLoupe - Report</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidenav" id="sidenav"></aside>
    <main class="content">
      <div class="page-head">
        <span class="eyebrow">New Report</span>
        <h1>File a Report</h1>
        <p>Help improve the community by reporting an issue.</p>
      </div>
      
      <div class="card" style="max-width: 600px; margin: 0 auto; animation-delay: 0.1s;">
        <form id="reportForm">
          <div class="input-group">
            <label for="title">What's happening?</label>
            <input type="text" id="title" class="form-control" placeholder="E.g., Pothole on Main St.">
          </div>
          
          <div class="input-group">
            <label for="category">Category</label>
            <select id="category" class="form-control">
              <option value="infrastructure">Infrastructure</option>
              <option value="safety">Safety</option>
              <option value="noise">Noise Complaint</option>
              <option value="other">Other</option>
            </select>
          </div>

          <div class="input-group">
            <label for="description">Provide more details</label>
            <textarea id="description" class="form-control" placeholder="Describe the issue in detail..."></textarea>
          </div>

          <div class="input-group" style="margin-bottom: 2rem;">
            <div style="border: 2px dashed var(--border-color); border-radius: 12px; padding: 2rem; text-align: center; cursor: pointer; transition: all 0.3s;" onmouseover="this.style.borderColor='var(--accent-color)'" onmouseout="this.style.borderColor='var(--border-color)'">
              <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-bottom: 1rem; color: var(--text-secondary);">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <circle cx="8.5" cy="8.5" r="1.5"></circle>
                <polyline points="21 15 16 10 5 21"></polyline>
              </svg>
              <p style="margin: 0; color: var(--text-primary);">Click to upload photos/videos</p>
              <p style="margin: 0; font-size: 0.85rem; color: var(--text-secondary);">or drag and drop here</p>
            </div>
          </div>
          
          <button type="button" class="btn-primary">Post Report</button>
        </form>
      </div>
    </main>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
